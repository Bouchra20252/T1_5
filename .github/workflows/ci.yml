name: CI

on: [push, pull_request]

jobs:
  tp1:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pandas scikit-learn pytest "fastapi==0.115.*" "httpx==0.27.*" "uvicorn==0.30.*"
          pip install -r requirements-dev.txt

      - name: Entraînement du modèle de démonstration
        run: |
          . .venv/bin/activate
          python src/make_demo.py
          python src/train.py

      - name: Vérification Ruff
        run: . .venv/bin/activate && ruff check .

      - name: Vérification Mypy
        run: . .venv/bin/activate && mypy api

      - name: Tests avec couverture
        run: . .venv/bin/activate && pytest -q --cov=api --cov-report=term-missing --cov-fail-under=95